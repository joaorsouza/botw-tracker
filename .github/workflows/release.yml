# Release: único caminho para produção.
# Bumpa a versão (npm version), pusha commit+tag na main e promove main → release.
# As branches main e release são protegidas por rulesets com bypass para
# "Deploy keys": os pushes deste workflow se autenticam via deploy key
# (secret DEPLOY_KEY = chave privada; a pública está em Settings → Deploy keys
# com write access) — humanos não conseguem push direto.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Tipo de release'
        required: true
        default: 'minor'
        type: choice
        options:
          - minor
          - patch
          - major

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Gate de release: tsc + build de produção precisam passar
      - run: npm run build

      - name: Configurar identidade do bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump de versão + tag
        run: npm version ${{ inputs.bump }}

      - name: Push na main (commit de versão + tag)
        run: git push --follow-tags origin main

      - name: Promover para produção (release)
        run: git push origin main:release
